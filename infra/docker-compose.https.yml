# HTTPS + Cloudflare override，叠加在 docker-compose.prod.yml 之上：
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.https.yml ...
# 只有站在 CF 后面、需要 443 的目标才带上（见 scripts/deploy_targets.sh 的 COMPOSE_FILES）。
# 腾讯云不加载本文件，它的 nginx 依旧只监听 80、用 radar.conf、不需要证书。
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 只给缓存判据用，不参与任何鉴权（真正的鉴权在后端 require_admin）。
      # `:?` 让 ADMIN_TOKEN 缺失或为空时**部署当场失败**，而不是渲染出一个
      # 把空 cookie 判成管理员、静默让全站缓存失效的配置。
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in .env}
      # 只替换 ADMIN_TOKEN 这一个名字，杜绝 envsubst 误伤 nginx 自己的
      # $host / $uri / $arg_* 等变量。
      NGINX_ENVSUBST_FILTER: "^ADMIN_TOKEN$"
    volumes:
      # 用 CF 专用配置替换掉 prod.yml 里挂的 radar.conf
      - ./nginx/radar-cf.conf:/etc/nginx/conf.d/default.conf:ro
      # http 级配置：real_ip 还原 + $from_cloudflare 白名单变量，会被 conf.d/*.conf 自动 include
      - ./nginx/cloudflare-ips.conf:/etc/nginx/conf.d/cloudflare-ips.conf:ro
      # http 级加固：缓存区 + 缓存键规范化。00- 前缀保证它排在 default.conf 之前加载
      # （共享内存区必须先定义后引用），改名会让 nginx 启动就报 unknown zone
      - ./nginx/00-hardening.conf:/etc/nginx/conf.d/00-hardening.conf:ro
      # 管理员判据要比对真实 token，需要启动时做环境变量替换，所以走模板机制：
      # 挂进 templates/ 而不是 conf.d/，容器启动时渲染成 conf.d/00-admin-token.conf。
      # 名字里的 00- 保证它排在 00-hardening.conf 之前（那边引用了它定义的变量）。
      - ./nginx/00-admin-token.conf.template:/etc/nginx/templates/00-admin-token.conf.template:ro
      # location 级共用片段。必须挂在 snippets/ 而不是 conf.d/：
      # conf.d 会被自动 include 进 http 上下文，里面的 location 级指令会直接报错。
      #
      # ⚠ radar-cf.conf 里 include 的每一个 snippet 都必须在这里挂载。
      #   漏一个 = nginx 启动即 [emerg]，容器进入 Restarting 循环，
      #   而 CF 那边表现为 521（连不上源站）——从 521 反查到"少挂了一个文件"
      #   要绕一大圈。2026-08-13 发布时就漏了 proxy-cached.conf，整站中断约 2 分钟。
      - ./nginx/proxy-common.conf:/etc/nginx/snippets/proxy-common.conf:ro
      - ./nginx/proxy-cached.conf:/etc/nginx/snippets/proxy-cached.conf:ro
      - ./nginx/edge-cacheable-page.conf:/etc/nginx/snippets/edge-cacheable-page.conf:ro
      - ./nginx/edge-cacheable-api.conf:/etc/nginx/snippets/edge-cacheable-api.conf:ro
      - ../data/certs:/etc/nginx/certs:ro
