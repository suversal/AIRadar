# 每个服务都带 logging.max-size/max-file：docker 默认的 json-file 驱动**不轮转**，
# 日志会一直涨到撑爆磁盘；而没有留存策略又意味着出事后无从取证。
# 50m × 20 ≈ 每个服务 1GB，nginx 那份足够回溯很久。
# 这条是抄 AIHOT 被攻击的教训：他能复盘出完整攻击链全靠访问日志，
# 事后把留存拉到了一年。见 docs/2026-08-13-hardening-plan.md 第 3.1 节。
#
# Production compose for the 2C2G Tencent Lighthouse box.
# Only nginx (80) is public. Postgres is bound to 127.0.0.1: the local
# pipeline runs against the local Mac database, and data reaches this box
# via scripts/sync_db_to_server.sh (pg_dump over ssh), never a direct
# database connection — keep 5432 closed in the console firewall too.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "20"
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: radar
      TZ: Asia/Shanghai
    # POSTGRES_BIND 控制监听地址，默认只听本机。数据同步走 ssh
    # （scripts/sync_db_to_server.sh），线上不需要把 5432 开到公网。
    #
    # 2026-08-13 之前这里默认 0.0.0.0，理由是"不静默改变腾讯云那台在跑的生产机"。
    # 那台机器当晚已停机，理由不复存在，而这个默认值本身是危险的：新机器只要忘了
    # 在 .env 里配 POSTGRES_BIND，整个库就直接敞在公网上、只剩数据库密码在挡
    # （腾讯云那台就这么敞了很久，直到 2026-08-13 才实测发现）。
    # 真需要公网直连时在 .env 里显式写 POSTGRES_BIND=0.0.0.0 覆盖。
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "20"
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160m

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      args:
        # ⚠️ 默认值是国内（腾讯）PyPI 镜像，那台机器 2026-08-13 已停机。
        # 现在唯一的线上机器 greenvps 在美国，走这个默认值会明显变慢——
        # 它在自己的 .env 里显式设了官方源覆盖掉，所以目前没暴露问题。
        # 换句话说：这个默认值现在只对"忘了配 .env 的新机器"生效，而那多半是台海外机器。
        # 没有直接改成官方源，是因为改默认值会影响未来可能的国内部署；留给部署方在 .env 里定。
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "20"
    environment:
      TZ: Asia/Shanghai
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        # 埋点站点 ID（umami 面板里建好站点后拿到的 UUID）。
        # 走 build arg 而不是 environment，是因为 NEXT_PUBLIC_* 是 `next build`
        # **构建时**内联进产物的。用运行时环境变量会踩一个静默的坑：
        # 被静态预渲染的页面在构建阶段就把当时的空值烘死了，那些页面永远不埋点，
        # 而面板上只是数字偏低、不会报错——正是最难发现的失败模式。
        # 代价是改 ID 要重建前端镜像，但这个 ID 基本只填一次。
        # 留空则埋点组件整体不渲染（本地 dev 与未配置的机器天然不埋点）。
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "20"
    environment:
      AI_RADAR_API_BASE_URL: http://api:8000
      TZ: Asia/Shanghai
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 384m

  # 访问统计。数据落在**同一个 postgres 实例里的独立 umami 库**，不是 radar 库——
  # sync_db_to_server.sh 是整库替换（建 radar_new → rename 顶掉 radar → DROP radar_old），
  # 任何写进 radar 的埋点数据都会在下一次同步时被连根丢掉。它只动 radar* 这三个名字，
  # 所以同实例内另开一个库是安全的，也省下再跑一份 postgres 的内存。
  #
  # ⚠️ umami 库要**手动建**：infra/postgres/init.sql 只在数据卷首次初始化时执行，
  #    现有卷早已初始化过，改那个文件不会有任何效果。一次性执行：
  #      docker exec infra-postgres-1 psql -U radar -d postgres \
  #        -c "CREATE DATABASE umami OWNER radar;"
  #    表结构由 umami 自带的 Prisma migration 在首次启动时自动建，不进 Alembic——
  #    「Alembic 独占 schema」那条不变式约束的是 radar 库，两者互不干涉。
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "20"
    environment:
      # 复用 postgres 服务的 radar 用户（它就是 umami 库的 owner），不另起账号。
      # 插值取自仓库根的 .env：部署时是 `cd <repo> && docker compose --env-file .env ...`。
      DATABASE_URL: postgresql://radar:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${UMAMI_DB_NAME:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:?set in .env}
      # 两步验证密钥的加密密钥（64 字符 hex）。**不配会让用户管理接口直接抛异常**：
      # 后台"编辑用户"点了没反应、日志里是 `TWO_FACTOR_ENCRYPTION_KEY is missing or
      # invalid`。名字看着像"只有开了 2FA 才需要"，实际上用户相关接口一律先校验它，
      # 所以它是必填而不是可选。2026-08-15 实测踩到。
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_KEY:?set in .env}
      # 自定义脚本名与上报路径——自托管的核心收益就在这两行。默认的 /script.js 与
      # /api/send 已被 EasyPrivacy 一类的名单按路径收录，改个名就免疫了。
      # 改这两个值必须同步改 nginx/radar-cf.conf 里对应的两个 location，否则 404。
      TRACKER_SCRIPT_NAME: s.js
      COLLECT_API_ENDPOINT: /api/collect
      # 站在 CF + nginx 两层后面，必须显式指定真实客户端 IP 从哪个头取。
      # 不配这个，所有访客会被算成同一个人（都是 nginx 的容器 IP），
      # 留存数字直接失真——而且失真得很安静，面板照样出图。
      CLIENT_IP_HEADER: CF-Connecting-IP
      # 显式写出默认值，因为这个值直接决定留存报表能看多远，而且直觉是反的：
      # session_id = uuid(websiteId, ip, userAgent, salt)，salt 按这个周期轮换
      # （src/app/api/send/route.ts）。而留存报表是 group by session_id 算的，
      # 所以 salt 一轮换，同一个人就变成新访客、cohort 当场断掉。
      # 源码里只有 day / week / month 三档（其它值一律 fallback 到 month），
      # month 已经是最长的一档 —— 不要为了"更隐私"改成 day，那等于把留存报表清零。
      SALT_ROTATION: month
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "20"
    ports:
      - "80:80"
    volumes:
      - ./nginx/radar.conf:/etc/nginx/conf.d/default.conf:ro
    # ⚠️ umami 必须列在这里：radar-cf.conf 里是 `proxy_pass http://umami:3000`
    #    这种不带变量的写法，nginx **在启动时**就要解析主机名，解析不到就是
    #    [emerg] host not found → 容器进入 Restarting 循环 → CF 那边表现为 521。
    #    与 web 同样的道理，漏一个就是整站中断。
    depends_on:
      - web
      - umami
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  postgres-data:
