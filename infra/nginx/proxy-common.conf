# 回源用的请求头与超时，不含 proxy_pass —— 缓存与非缓存两类 location 的
# proxy_pass 写法不同（见 proxy-cached.conf），所以拆出来共用这部分。
#
# 挂在 /etc/nginx/snippets/ 而不是 conf.d/：conf.d/*.conf 会被 nginx 在 http
# 上下文自动 include，而这里全是 location 级指令，放进去启动就报错。

proxy_http_version 1.1;
proxy_set_header Host $host;
# 经过 real_ip 还原后，$remote_addr 已经是真实访客 IP
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# CF 与源站之间这一跳固定是 https，写死避免 Next.js 生成 http 链接
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 60s;

# 验收和排障全靠它，不要删。
#
# 放在这里而不是 server 块，是 nginx 的 add_header 继承规则决定的：
# 只要某个 location 自己写了 add_header，server 级的全部**不再继承**。
# 公开页面那几个 location 需要自己加 Cache-Control（见 edge-cacheable-*.conf），
# 一旦这么做，写在 server 级的这条就会在那些 location 里凭空消失。
# 放进这个被所有 location 引用的片段里，就不会漏。
add_header X-Cache-Status $upstream_cache_status always;
