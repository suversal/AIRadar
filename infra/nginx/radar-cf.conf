# greenvps 专用入口：站在 Cloudflare 后面，只接受 CF 回源。
# 由 docker-compose.https.yml 挂载为 default.conf，替换掉腾讯云用的 radar.conf。
# （腾讯云 2026-08-13 已停机，radar.conf 现在没有机器在用；本文件是唯一生效的入口配置。）
#
# 依赖两个同目录文件（nginx 会自动 include conf.d/*.conf）：
#   cloudflare-ips.conf   提供 $from_cloudflare 变量和 real_ip 还原
#   00-hardening.conf     提供 proxy_cache 区、缓存键规范化的 $ck_* 变量、
#                         以及 $skip_cache_* 判据。文件名的 00- 前缀是必须的，
#                         定义必须排在引用之前，理由写在那个文件开头。
# 以及两个 snippets：proxy-common.conf（共用的回源请求头）、
# proxy-cached.conf（可缓存 location 用，额外做查询参数白名单化后再回源）。
#
# 为什么用 geo 变量而不是 allow/deny：realip 模块会在 access 阶段之前把
# $remote_addr 换成真实访客 IP，allow 拿到的就不再是 CF 的地址了，会误杀所有人。

server {
    listen 80 default_server;
    server_name _;

    # 直连源站 IP 的扫描流量到此为止；CF 在 Full 模式下回源只走 443，
    # 所以正常访客不会落到这个 server 块。
    if ($from_cloudflare = 0) {
        return 403;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    if ($from_cloudflare = 0) {
        return 403;
    }

    # Cloudflare Origin CA 证书，配合 CF 的 Full (strict) 模式。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 管理端图片上传走 Next.js 代理，这里要高于 IMAGE_UPLOAD_MAX_BYTES(10 MiB)，
    # 保证 nginx 不是拒绝上传的那一环。
    client_max_body_size 12m;

    # 覆盖官方镜像在 http 上下文写的那条 combined 日志。
    # 格式定义在 00-hardening.conf；这个路径在 nginx:alpine 里是指向
    # /dev/stdout 的软链，所以日志仍然进 docker logs，由 compose 的
    # logging.max-size / max-file 负责留存。
    access_log /var/log/nginx/access.log radar;

    # -----------------------------------------------------------------------
    # 缓存：server 级设默认值，各 location 只覆盖 TTL；不该缓存的显式关掉。
    # -----------------------------------------------------------------------
    proxy_cache            radar;
    # $ckey 由 snippets/proxy-cached.conf 在 location 里 set，
    # 同一个值也是回源查询串，保证"键"和"内容"永远对得上。
    proxy_cache_key        "$scheme$host$uri?$ckey";
    proxy_cache_valid      200 301 302 307 180s;
    proxy_cache_valid      404 10s;

    # 合单：同一时刻 100 个人要同一个页面，只放 1 个请求回源，
    # 其余在这里等结果。没有这一条，缓存过期的瞬间会有一批请求同时穿透
    # （缓存击穿），正是攻击者要的效果。
    proxy_cache_lock          on;
    proxy_cache_lock_timeout  10s;

    # 回源失败或正在更新时，宁可发一份过期内容也不发错误页。
    # 顺带兜住了整库同步时改名+重启 api 的那 2~3 秒窗口。
    proxy_cache_use_stale  updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # Next 给动态页面一律发 `no-store`（因为它们读了 searchParams 被判定为动态渲染），
    # 不忽略的话这一整套缓存等于没配。
    # 前提是这些页面对所有匿名访客完全相同——收藏是浏览器本地 localStorage、
    # 主题是客户端脚本，服务端 HTML 里没有任何按人区分的内容。
    # 故意不忽略 Set-Cookie：万一哪天某个公开页面开始下发 cookie，
    # nginx 会自动拒绝缓存它，这是我们要的安全失败方向。
    proxy_ignore_headers   Cache-Control Expires;

    proxy_cache_bypass     $skip_cache_admin $skip_cache_rsc;
    proxy_no_cache         $skip_cache_admin $skip_cache_rsc;

    # X-Cache-Status 挂在 snippets/proxy-common.conf 里，不在这里 ——
    # location 一旦自带 add_header 就不再继承 server 级的，写在这会被静默丢掉。

    # -----------------------------------------------------------------------
    # 可缓存：静态资源
    # -----------------------------------------------------------------------
    # 文件名带内容哈希，可以放心长缓存。用 ^~ 是为了压过后面的正则 location。
    location ^~ /_next/static/ {
        include snippets/proxy-cached.conf;
        proxy_cache_valid 200 30d;
    }

    location ^~ /brand/ {
        include snippets/proxy-cached.conf;
        proxy_cache_valid 200 7d;
    }

    location ~* ^/(robots\.txt|sitemap\.xml|opengraph-image|icon\.svg|apple-icon\.png|favicon\.ico)$ {
        include snippets/proxy-cached.conf;
        proxy_cache_valid 200 1h;
    }

    # -----------------------------------------------------------------------
    # 可缓存：公开页面（白名单，与 apps/web/app/sitemap.ts 对齐）
    # -----------------------------------------------------------------------
    # "/" 是到 /latest 的 307 跳转，单独用精确匹配，避免 location / 把它吃掉。
    location = / {
        include snippets/proxy-cached.conf;
        include snippets/edge-cacheable-page.conf;
        limit_req  zone=pages burst=30 nodelay;
        limit_conn perip 20;
    }

    location ~ ^/(latest|all|daily|x|telegram|topics|weekly|monthly|search|about|agent|changelog|feedback|event)(/|$) {
        include snippets/proxy-cached.conf;
        include snippets/edge-cacheable-page.conf;
        limit_req  zone=pages burst=30 nodelay;
        limit_conn perip 20;
    }

    # -----------------------------------------------------------------------
    # 可缓存：公开只读 API（前端"加载更多"用的那几个）
    # -----------------------------------------------------------------------
    # 注意别把 /api/feedback、/api/admin-* 、/api/refresh-latest 圈进来，
    # 它们全部落到最后的 location / 里，不缓存。
    location ~ ^/api/(latest-events|all-events|telegram-events|events/) {
        include snippets/proxy-cached.conf;
        include snippets/edge-cacheable-api.conf;
        proxy_cache_valid 200 60s;
        limit_req  zone=api burst=60 nodelay;
        limit_conn perip 20;
    }

    # -----------------------------------------------------------------------
    # 可缓存：Agent 接入的无参数出口（RSS / llms.txt / OpenAPI / Skill 包）
    # -----------------------------------------------------------------------
    # 这几条都不带查询参数，所以 proxy-cached.conf 的白名单规范化对它们是
    # 无害的（$ckey 恒为空）。
    #
    # 不 include edge-cacheable-api.conf：那个 snippet 会 proxy_hide_header
    # 掉上游的 Cache-Control 再统一写成 s-maxage=60。这些 route handler 自己
    # 发的是正确的分档 TTL（feed 900 秒），/agent 页面和 llms.txt 还把
    # "按 s-maxage 定轮询间隔"写成了对客户端的承诺——被覆盖成 60 秒，
    # 文档就成了假的。
    location ~ ^/(feed\.xml|llms\.txt|openapi-v1\.json)$ {
        include snippets/proxy-cached.conf;
        proxy_cache_valid 200 15m;
        limit_req  zone=api burst=60 nodelay;
        limit_conn perip 20;
    }

    location ^~ /feed/ {
        include snippets/proxy-cached.conf;
        proxy_cache_valid 200 15m;
        limit_req  zone=api burst=60 nodelay;
        limit_conn perip 20;
    }

    # Skill 包是 public/ 下的静态文件，内容随版本走，长一点无妨。
    location ^~ /ai-radar-skill/ {
        include snippets/proxy-cached.conf;
        proxy_cache_valid 200 1h;
        limit_req  zone=api burst=60 nodelay;
        limit_conn perip 20;
    }

    # -----------------------------------------------------------------------
    # 刻意不缓存：/api/v1/* 与 /api/mcp
    # -----------------------------------------------------------------------
    # 它们落到最后的 location / （不缓存，但带 api 档限流），这是有意的：
    #
    # 1. proxy-cached.conf 会把查询串换成白名单规范化后的版本，而 v1 用了
    #    mode / window / hours 这些名单外的参数。一旦进了可缓存 location，
    #    ?window=24h 会被静默丢掉，客户端问"过去 24 小时"却拿到 7 天的数据——
    #    不报错，只是答案错了。想加缓存必须先在 00-hardening.conf 补 map，
    #    并同步 proxy-cached.conf 的 $ckey 拼接串。
    # 2. 规范化还会顺手吃掉未知参数，而 v1 对外承诺的是"未声明参数返回 400"。
    #    缓存一开，这条承诺就静默失效了。
    # 3. /api/mcp 是 POST，本来就不该缓存。
    #
    # 容量不靠这一层：v1 的取数走 Next 的 Data Cache（fetchUpstream 里的
    # revalidate），DB 压力已经挡掉了；响应自带的 s-maxage 供下游 CDN 与
    # 客户端使用。

    # -----------------------------------------------------------------------
    # 访问统计（umami）：脚本与上报都挂在主域上
    # -----------------------------------------------------------------------
    # 为什么不放到 stats 子域去：子域名里带 "stats" 这类字样很容易被拦截器名单
    # 按域名收录，数据面一旦依赖它就会静默漏采。放在主域的第一方路径上最稳，
    # 这也是自托管相对 Umami Cloud 的核心收益。
    #
    # 路径名 /s.js 与 /api/collect 是故意改掉默认值的（默认 /script.js 与
    # /api/send 已被 EasyPrivacy 一类名单按路径收录），与 docker-compose.prod.yml
    # 里 umami 服务的 TRACKER_SCRIPT_NAME / COLLECT_API_ENDPOINT **必须一致**，
    # 改一边就是 404。
    #
    # ⚠️ 两条都必须用精确匹配 `=`：上面那条 `location ~ ^/api/(latest-events|...)`
    #    的白名单里没有 collect，不写这条它会落到兜底的 `location /` 被代理去
    #    web:3000，表现为上报全部 404。
    # ⚠️ 都不能 include proxy-cached.conf：那个片段里硬编码着
    #    `proxy_pass http://web:3000$uri?$ckey`，include 进来请求就打到前端去了。
    #    这里只 include proxy-common.conf（纯请求头，不含 proxy_pass）。

    # 埋点脚本：内容随版本才变，放心长缓存。
    # server 级已设 proxy_cache radar，这里只覆盖 TTL。
    # 未 set $ckey 时它取空值，缓存键落成 "https<host>/s.js?"，稳定且唯一。
    location = /s.js {
        include snippets/proxy-common.conf;
        proxy_pass http://umami:3000;
        proxy_cache_valid 200 1d;
    }

    # 上报接口：POST，绝不缓存。
    # 限流走 api 档而不是 strict：正常访客每开一个页面就打一次，
    # strict 那档（正常人一天用不了几次）会把真实访客大面积误杀。
    location = /api/collect {
        include snippets/proxy-common.conf;
        proxy_pass http://umami:3000;
        proxy_cache off;
        limit_req  zone=api burst=60 nodelay;
        limit_conn perip 20;
    }

    # -----------------------------------------------------------------------
    # 不缓存但要单独限流的几个口子
    # -----------------------------------------------------------------------
    # 图片代理：每张图都是一次出站 fetch，是整站最贵的接口。
    # 一屏文章可能有几十张图，所以配额给得高，靠的是"很难被单点刷爆"而不是"很难被用"。
    # 用 ^~ 前缀匹配压过后面的正则 location。
    location ^~ /api/image-proxy {
        include snippets/proxy-common.conf;
        proxy_pass http://web:3000;
        proxy_cache off;
        limit_req  zone=imgproxy burst=100 nodelay;
        limit_conn perip 30;
    }

    # 反馈接口：写库 + 推 Telegram，正常人一天用不了几次。
    # 这一档挡的是单点高频；多 IP 协同那种每个 IP 都压在线下的打法，
    # 由后端的全局总量上限兜（见 apps/api/app/main.py 的 FEEDBACK_GLOBAL_MAX）。
    location = /api/feedback {
        include snippets/proxy-common.conf;
        proxy_pass http://web:3000;
        proxy_cache off;
        limit_req  zone=strict burst=3 nodelay;
        limit_conn perip 5;
    }

    # 管理员登录：token 比较本身是恒定时间的，但没有任何东西拦住无限次尝试。
    location = /admin/login {
        include snippets/proxy-common.conf;
        proxy_pass http://web:3000;
        proxy_cache off;
        limit_req  zone=strict burst=3 nodelay;
        limit_conn perip 5;
    }

    # -----------------------------------------------------------------------
    # 其余一律不缓存：/admin、/api/admin-proxy、/api/admin-upload-image、
    # /api/refresh-latest、/bookmarks…
    # 新增路由默认落在这里，是安全的失败方向——顶多不快，不会串数据。
    # 这里也挂 api 档限流：后台是登录态才能用，但**路径本身对未登录的人是可达的**，
    # 不挂就等于给攻击者留了一条没有配额的入口。
    # -----------------------------------------------------------------------
    location / {
        include snippets/proxy-common.conf;
        proxy_pass http://web:3000;
        proxy_cache off;
        limit_req  zone=api burst=60 nodelay;
        limit_conn perip 20;
    }
}

# ---------------------------------------------------------------------------
# umami 管理面板：stats.suversal.com
# ---------------------------------------------------------------------------
# 只放面板（看数据的地方）。埋点脚本与上报**不走这里**，它们在上面主域的
# /s.js 与 /api/collect —— 理由见那一节的注释。
#
# 具名 server_name 优先于上面两个 default_server，所以加这个块不会改变
# 主站任何一条现有流量的走向。
#
# ⚠️ $from_cloudflare 判据必须照抄。漏掉它，这个子域就成了一条绕过源站保护的路：
#    任何人直连源站 IP 带上这个 Host 就能摸到面板登录页。
# ⚠️ 面板的公网可达性依赖 CF DNS 里 stats 那条 A 记录**开橙云代理**。
#    不开则回源不来自 CF 网段，这里直接 403（而不是暴露源站）——
#    这是有意的失败方向：配错了是打不开，不是敞开。
server {
    listen 443 ssl;
    http2 on;
    server_name stats.suversal.com;

    if ($from_cloudflare = 0) {
        return 403;
    }

    # 与主站共用同一份 CF Origin CA 证书：它的 SAN 是 *.suversal.com + suversal.com
    # （2026-08-14 实测，有效期至 2041），已经覆盖这个子域，不需要另签。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/access.log radar;

    location / {
        include snippets/proxy-common.conf;
        proxy_pass http://umami:3000;
        # 面板全是登录态页面，一律不缓存。必须显式关掉：
        # proxy_cache 那一套设在上面的 server 块里，本块不继承，
        # 但把它写出来是为了让"这里绝不缓存"成为读代码时的显式约定。
        proxy_cache off;
        limit_req  zone=api burst=60 nodelay;
        limit_conn perip 20;
    }
}
