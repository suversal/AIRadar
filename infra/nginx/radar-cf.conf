# greenvps 专用入口：站在 Cloudflare 后面，只接受 CF 回源。
# 由 docker-compose.https.yml 挂载为 default.conf，替换掉腾讯云用的 radar.conf。
#
# 依赖同目录的 cloudflare-ips.conf（nginx 会自动 include conf.d/*.conf），
# 它在 http 上下文提供 $from_cloudflare 变量和 real_ip 还原。
#
# 为什么用 geo 变量而不是 allow/deny：realip 模块会在 access 阶段之前把
# $remote_addr 换成真实访客 IP，allow 拿到的就不再是 CF 的地址了，会误杀所有人。

server {
    listen 80 default_server;
    server_name _;

    # 直连源站 IP 的扫描流量到此为止；CF 在 Full 模式下回源只走 443，
    # 所以正常访客不会落到这个 server 块。
    if ($from_cloudflare = 0) {
        return 403;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    if ($from_cloudflare = 0) {
        return 403;
    }

    # 自签名证书，配合 CF 的 Full 模式。换成 CF Origin CA 证书后
    # 可把 CF 切到 Full (strict)，这里的路径不用改。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 管理端图片上传走 Next.js 代理，这里要高于 IMAGE_UPLOAD_MAX_BYTES(10 MiB)，
    # 保证 nginx 不是拒绝上传的那一环。
    client_max_body_size 12m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 经过 real_ip 还原后，$remote_addr 已经是真实访客 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CF 与源站之间这一跳固定是 https，写死避免 Next.js 生成 http 链接
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
