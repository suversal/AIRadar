# 同 edge-cacheable-page.conf，但 TTL 更短：公开只读 API 是"加载更多"用的，
# 它比页面本身更容易让人察觉到数据旧。
#
# 这几个 route handler 本身不发 Cache-Control（Response.json 不带），
# 所以 CF 的 "use cache-control if present, bypass if not" 会直接跳过缓存——
# 必须在这里补上，边缘缓存才会生效。
proxy_hide_header Cache-Control;
add_header Cache-Control $public_api_cache_control always;
