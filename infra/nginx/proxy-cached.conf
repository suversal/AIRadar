# 可缓存 location 的回源方式：把查询串换成白名单规范化后的版本。
#
# proxy_pass 一旦带上 URI，nginx 就用这个 URI 回源，而不是原始请求行。
# 于是名单外参数（?_=1731…）和非法值在这里被彻底丢掉：
# 上游收到的和缓存键用的是同一个查询串，两者不可能不一致。
#
# $ckey 的拼接顺序固定（按参数名字母序），保证同一组条件永远得到同一个键。
# 新增白名单参数时，00-hardening.conf 加 map，这里加进拼接串，两处都要改。

include snippets/proxy-common.conf;

set $ckey "$ck_category$ck_channel$ck_date$ck_days$ck_focus$ck_handle$ck_kind$ck_limit$ck_offset$ck_q$ck_source$ck_tag$ck_topic";

proxy_pass http://web:3000$uri?$ckey;
