# 把 Next 发的 `no-store` 换成一个可被 Cloudflare 缓存的短 TTL。
# 只用于公开页面 HTML。变量定义与理由见 00-hardening.conf 第三点五节。
#
# proxy_hide_header 去掉上游那条，add_header 换上我们自己的；
# `always` 是必须的——默认 add_header 只作用于 2xx/3xx 的一个子集，
# 而这里连 404 也应该带上正确的缓存语义。
proxy_hide_header Cache-Control;
add_header Cache-Control $public_cache_control always;
