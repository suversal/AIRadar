# http 级加固配置：反向代理缓存 + 缓存键规范化。
# 由 docker-compose.https.yml 挂进 conf.d/，nginx 自动 include。
#
# ⚠ 文件名前缀 00- 是必须的，不是排版洁癖。
#   nginx 按字母序加载 conf.d/*.conf，而 proxy_cache_path / limit_req_zone
#   这类"定义共享内存区"的指令必须出现在引用它们的 proxy_cache / limit_req 之前，
#   否则启动直接报 unknown zone。default.conf（radar-cf.conf）里全是引用方，
#   所以定义方必须排在它前面。
#
# 背景见 docs/2026-08-13-hardening-plan.md。

# ---------------------------------------------------------------------------
# 零、访问日志格式
# ---------------------------------------------------------------------------
# 默认的 combined 格式缺三样东西，而出事时恰恰全靠它们：
#   $upstream_cache_status  这次请求命中缓存没有——没有它就无法判断缓存是否真在工作，
#                           也就无法判断"站点变慢"是缓存失效还是被打了
#   $request_time           这个请求花了多久——攻击的第一个信号往往是它先变长
#   $http_cf_ray            Cloudflare 的请求 ID，用来和 CF 那边的日志对上
# $remote_addr 经过 real_ip 还原后是真实访客 IP，可以直接拿来统计。
#
# 这里只定义格式，`access_log` 挂在 radar-cf.conf 的 server 块里：
# 官方镜像的 nginx.conf 已经在 http 上下文写了一条 access_log，
# 在这里再写一条不会覆盖它而是**两条都生效**，日志量直接翻倍。
# 写在 server 块里才是覆盖。
log_format radar '$remote_addr - [$time_local] "$request" '
                 '$status $body_bytes_sent ${request_time}s '
                 'cache=$upstream_cache_status cf=$http_cf_ray '
                 'ref="$http_referer" ua="$http_user_agent"';

# ---------------------------------------------------------------------------
# 一、缓存区
# ---------------------------------------------------------------------------
# 不挂 volume，缓存留在容器内：重启即冷启，代价只是重新预热几秒。
# 挂出来反而要处理 nginx 用户(uid 101)的目录权限，收益不值。
proxy_cache_path /var/cache/nginx/radar
                 levels=1:2
                 keys_zone=radar:20m      # 约 16 万个 key 的元数据
                 max_size=1g
                 inactive=10m
                 use_temp_path=off;

# ---------------------------------------------------------------------------
# 一点五、限流
# ---------------------------------------------------------------------------
# 键用 $binary_remote_addr —— 经过 cloudflare-ips.conf 的 real_ip 还原之后，
# 它已经是**真实访客 IP** 而不是 CF 边缘节点的地址。这一点是前提：
# 如果 real_ip 没生效，所有流量会被算到那十几个 CF 出口上，
# 限流的结果只能是要么全放、要么全杀。改动 cloudflare-ips.conf 时务必记得这里依赖它。
#
# 分档的依据是"这个请求让服务器付出多少代价"，不是路径长得像不像：
#   pages    页面 HTML。命中缓存很便宜，回源要跑一次完整 SSR
#   api      公开只读接口。前端"加载更多"会连续打，放宽一些
#   imgproxy 图片代理。一屏文章可能有几十张图，必须给足
#   strict   写接口与登录。正常人一天用不了几次，被刷则代价很大
#
# 注意：limit_req 在 preaccess 阶段执行，早于缓存查找，
# 所以**命中缓存的请求同样会消耗配额**。阈值是按"人的浏览速度"定的：
# pages 的 60r/m 相当于每秒翻一页，真人手速远达不到。
# 静态资源（/_next/static、/brand）完全不挂限流：一个页面会带出几十个这样的请求，
# 挂上去只会误伤真实用户，而它们本身既便宜又长缓存。
limit_req_zone  $binary_remote_addr zone=pages:10m    rate=60r/m;
limit_req_zone  $binary_remote_addr zone=api:10m      rate=120r/m;
limit_req_zone  $binary_remote_addr zone=imgproxy:10m rate=300r/m;
limit_req_zone  $binary_remote_addr zone=strict:10m   rate=6r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 429 而不是默认的 503：503 会让 CF 以为源站挂了。
limit_req_status  429;
limit_conn_status 429;
# 触发限流要能在日志里看见，否则"用户说打不开"时无从查起。
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# 二、查询参数白名单
# ---------------------------------------------------------------------------
# 攻击者在 URL 后面挂随机参数（?_=1731...）来制造"每次都是新页面"的假象，
# 逼服务器重新渲染 —— 这是应用层 CC 攻击的标准打法。
# 直接用 $args 做缓存键正中下怀，所以这里逐个参数白名单化。
#
# ⚠ 这份规范化结果既是缓存键，也是**真正发给上游的查询串**
#   （见 snippets/proxy-cached.conf 的 proxy_pass）。两者必须是同一个值，
#   只规范化缓存键、却把原始参数原样回源，会开出一个缓存投毒的口子：
#   攻击者请求 ?q=<非法超长串>，上游按这个串返回搜索结果，
#   而这份结果被存进了"没有 q 参数"的键里 —— 之后所有访问 /latest 的人
#   都会看到他的搜索结果。本地测试时就是这么发现的，别把它拆开。
#
#   合法值 → 原样带上；非法值和名单外参数 → 直接丢弃，上游当它们不存在。
#   丢弃是安全的：Next 页面本来就只读自己声明的 searchParams，
#   utm_* / gclid 这类只在浏览器里被读取，地址栏不受影响。
#
# 名单来自各页面 searchParams 的类型定义 + 各 API route 读取的参数，
# 新增参数时必须同步加在这里，否则那个筛选/翻页条件会被静默丢掉。
#
#   /latest              focus category q tag
#   /all                 source focus category q tag topic
#   /daily               date
#   /search              q
#   /x                   kind handle topic offset
#   /telegram            channel
#   /api/latest-events   limit offset category focus tag q
#   /api/all-events      days limit offset category focus source tag topic q
#   /api/telegram-events days limit offset channel
#
# 注意 $arg_* 拿到的是 URL 编码后的原始值，中文会变成 %XX 序列，
# 所以字符集必须放行 % 并把长度按编码后算（1 个汉字 = 9 个字符）。
# limit / days 这里只做格式过滤，真正的数值上限在后端（见加固计划阶段 2-2）。

map $arg_category $ck_category { default ""; "~^[A-Za-z0-9_-]{1,32}$"        "category=$arg_category&"; }
map $arg_channel  $ck_channel  { default ""; "~^[A-Za-z0-9_%.~-]{1,96}$"     "channel=$arg_channel&"; }
map $arg_date     $ck_date     { default ""; "~^[0-9]{4}-[0-9]{2}-[0-9]{2}$" "date=$arg_date&"; }
map $arg_days     $ck_days     { default ""; "~^[0-9]{1,4}$"                 "days=$arg_days&"; }
map $arg_focus    $ck_focus    { default ""; "~^[A-Za-z0-9_-]{1,32}$"        "focus=$arg_focus&"; }
map $arg_handle   $ck_handle   { default ""; "~^[A-Za-z0-9_%.~-]{1,96}$"     "handle=$arg_handle&"; }
map $arg_kind     $ck_kind     { default ""; "~^[A-Za-z0-9_-]{1,32}$"        "kind=$arg_kind&"; }
map $arg_limit    $ck_limit    { default ""; "~^[0-9]{1,4}$"                 "limit=$arg_limit&"; }
map $arg_offset   $ck_offset   { default ""; "~^[0-9]{1,6}$"                 "offset=$arg_offset&"; }
map $arg_q        $ck_q        { default ""; "~^[^\"'\\\\]{1,128}$"          "q=$arg_q&"; }
map $arg_source   $ck_source   { default ""; "~^[A-Za-z0-9_%.~-]{1,64}$"     "source=$arg_source&"; }
map $arg_tag      $ck_tag      { default ""; "~^[A-Za-z0-9_%.~-]{1,96}$"     "tag=$arg_tag&"; }
map $arg_topic    $ck_topic    { default ""; "~^[A-Za-z0-9_%.~-]{1,96}$"     "topic=$arg_topic&"; }

# ---------------------------------------------------------------------------
# 三、绕过缓存的判据
# ---------------------------------------------------------------------------
# proxy_cache_bypass / proxy_no_cache 可以接多个变量：任一非空且非 "0" 就绕过。
# 所以下面两个判据各自独立成一个 map，组合逻辑交给 nginx。

# 1) 管理员判据 $skip_cache_admin 不在这里定义 —— 它要比对真实的 ADMIN_TOKEN，
#    需要容器启动时做环境变量替换，所以单独放在 00-admin-token.conf.template。
#    （早期版本在这里写的是"cookie 非空就算管理员"，那是个攻击者可控的
#     缓存绕过开关，见那个文件开头的说明。）

# 2) RSC 请求（Next 客户端路由的 payload）不进缓存。
#    Next 对同一个 URL 会返回两种完全不同的东西：普通浏览器要 HTML，
#    客户端导航要 RSC flight payload，靠请求头 `RSC: 1` 区分，
#    响应里带 `Vary: rsc, next-router-state-tree, ...`。
#    nginx 自 1.7.7 起是认 Vary 的，所以不排除也不会串味；
#    但 next-router-state-tree 每条路径都不同，会让缓存条目爆炸而命中率极低。
#    直接放行 RSC 请求，把缓存留给真正值钱的那一类：
#    首屏 HTML、爬虫、以及攻击流量——它们都不带这个头。
map $http_rsc $skip_cache_rsc {
    default 1;
    ""      0;
}

# ---------------------------------------------------------------------------
# 三点五、发给 Cloudflare 的 Cache-Control
# ---------------------------------------------------------------------------
# Next 给动态页面一律发 `private, no-cache, no-store`，CF 照做就等于边缘不缓存，
# 访客的每个请求都要从他所在的边缘一路跑到圣何塞（实测国内看是 1.6~6.1 秒，
# 而源站自己只花 0.000s——时间几乎全花在路上）。
#
# 为什么用"源站发短 TTL"而不是"在 CF 里设 Edge TTL"：
# **免费版 Edge Cache TTL 的最小值是 2 小时**，对资讯站太长（新文章两小时才出现）。
# 而 CF 的 Origin Cache Control 在 Free/Pro/Business 上默认开启，会严格遵守
# 源站发来的 Cache-Control——那个 2 小时下限只约束控制台下拉框里的档位，
# 不约束源站自己给的值。于是把时长收回到这里，既绕开下限，又和 nginx 自己的
# proxy_cache_valid 放在同一处维护。
#
#   s-maxage  只对共享缓存（CF）生效，浏览器会忽略它
#   max-age=0 + must-revalidate  让浏览器每次都回来问，不会拿着旧 HTML 刷不掉
#
# 只有"既不是管理员、也不是 RSC 请求"时才对外声明可缓存：
#   管理员要看实时数据；
#   RSC 是同一个 URL 的另一种响应体，被 CF 缓存下来会串给普通浏览器请求，
#   表现为站内跳转白屏（CF 默认不看 Vary 头，见 concepts/cache-control 文档）。
map "$skip_cache_admin$skip_cache_rsc" $public_cache_control {
    "00"    "public, s-maxage=120, max-age=0, must-revalidate";
    default "private, no-cache, no-store, max-age=0, must-revalidate";
}

map "$skip_cache_admin$skip_cache_rsc" $public_api_cache_control {
    "00"    "public, s-maxage=60, max-age=0, must-revalidate";
    default "private, no-cache, no-store, max-age=0, must-revalidate";
}
